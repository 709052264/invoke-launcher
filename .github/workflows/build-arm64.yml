name: Build arm64 APK

on:
  workflow_dispatch:   # 允许在 Actions 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build arm64 release APK
        run: ./gradlew assembleRelease --split-per-abi --stacktrace

      - name: List generated APKs (debug)
        if: always()
        run: |
          echo "===== Searching all APK outputs ====="
          find app/build/outputs -type f -name "*.apk" || echo "No APK files found."
          echo "===== Directory tree under apk/ ====="
          find app/build/outputs/apk -maxdepth 3 -type d 2>/dev/null || true

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: invoke-arm64-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
